<!DOCTYPE html>
<html>
<body>
<pre id="result">Testing fetch...</pre>
<script>
const url = "https://cdn.jsdelivr.net/gh/achroma-ubg/svg@latest/index.svg";

fetch(url, { mode: "cors", cache: "no-store" })
  .then(r => {
    document.getElementById("result").textContent =
      "Fetch succeeded. HTTP status: " + r.status;
  })
  .catch(e => {
    document.getElementById("result").textContent =
      "Fetch failed: " + e.name + ": " + e.message;
  });
</script>
</body>
</html>
